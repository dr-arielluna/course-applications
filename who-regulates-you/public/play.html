<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Regulates You? — Play</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span> Who Regulates You?</div>
  <div id="app" class="stack"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";
const socket = io();
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let joined=false, ME={score:0,answer:null,name:""}, ST=null, myScreenRound=-1;
// A locked phone drops its connection. The browser keeps a token (this device's seat) and the
// PIN + name it joined with, and rejoins automatically on reconnect, so the team keeps its score.
const KEY="who-regulates-you";
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const ss={get:k=>{try{return JSON.parse(sessionStorage.getItem(k)||"null");}catch(e){return null;}}, set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let TOKEN=ls.get(KEY+":token");
if(!TOKEN){ TOKEN=((self.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/[^A-Za-z0-9_-]/g,""); ls.set(KEY+":token",TOKEN); }
let SEAT=ss.get(KEY+":seat");   // {pin,name} once joined
function rejoin(){ if(SEAT) socket.emit("player:join",{pin:SEAT.pin, name:SEAT.name, token:TOKEN}); }
socket.on("connect", rejoin);
socket.on("disconnect", () => { if(joined){ const b=document.getElementById("conn"); if(b) b.hidden=false; } });
document.addEventListener("visibilitychange", () => { if(!document.hidden && !socket.connected) socket.connect(); });

function screenJoin(err){
  const pin = new URLSearchParams(location.search).get("pin") || "";
  app.innerHTML = `
    <div class="card stack">
      <div><span class="kicker">Join the game</span><h1>Enter the PIN</h1></div>
      ${err?`<div class="feedback bad">${esc(err)}</div>`:""}
      <input type="text" id="pin" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" value="${esc(pin)}">
      <input type="text" id="name" maxlength="24" placeholder="Your name or team">
      <button class="btn primary lg" id="go">Join</button>
    </div>`;
  const go=()=>{
    const p=(document.getElementById("pin").value||"").trim();
    const n=(document.getElementById("name").value||"").trim();
    if(!p){ return; }
    SEAT={pin:p, name:n}; socket.emit("player:join",{pin:p, name:n, token:TOKEN});
  };
  document.getElementById("go").onclick=go;
  document.getElementById("name").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}

socket.on("join:ok", d => { joined=true; ME.name=d.name; SEAT={pin:d.pin, name:d.name}; ss.set(KEY+":seat",SEAT); render(); });
socket.on("join:error", msg => { joined=false; SEAT=null; ss.set(KEY+":seat",null); screenJoin(msg); });
socket.on("you", d => { ME.score=d.score; ME.answer=d.answer; if(joined) render(); });
socket.on("state", s => { ST=s; ST._at=Date.now(); if(joined){ render(); paintTimer(); } });
socket.on("host:gone", () => { joined=false; SEAT=null; ss.set(KEY+":seat",null); app.innerHTML="<div class='card stack'><h2>Game ended</h2><p class='muted'>The host closed the game. Refresh to join a new one.</p></div>"; });

function defenseButtons(disabled, highlightWorks){
  return `<div class="grid-def">` + ST.defenses.map(d=>{
    let cls="def";
    if(ME.answer===d.id) cls+=" sel";
    if(highlightWorks){ if(highlightWorks.includes(d.id)) cls+=" correct"; else if(ME.answer===d.id) cls+=" wrong"; }
    return `<button class="${cls}" data-def="${d.id}" ${disabled?"disabled":""}><span class="tag">${d.id}</span><span><span class="name">${esc(d.name)}</span><br><span class="desc">${esc(d.desc)}</span></span></button>`;
  }).join("") + `</div>`;
}
function wireDefense(){
  app.querySelectorAll("button.def").forEach(b=> b.onclick=()=>{ if(b.disabled) return; const l=b.getAttribute("data-def"); if(l===ME.answer) return; socket.emit("player:answer",{letter:l}); });
}
function scoreHeader(){ return `<div id="conn" class="note" hidden>Reconnecting… your score is saved.</div><div class="row spread"><span class="chip">${esc(ME.name)}</span><span class="chip">Score: <b>${ME.score}</b></span></div>`; }

/* round countdown — the server owns the clock; this only paints it between updates */
function timerHTML(){ return ST && ST.timer ? `<div class="timer" id="timer"></div>` : ""; }
function timeUp(){ return !!(ST && ST.timer && ST.timer.locked); }
function paintTimer(){
  const el=document.getElementById("timer"); if(!el||!ST||!ST.timer) return;
  const t=ST.timer, left=t.running ? Math.max(0, t.remainingMs-(Date.now()-(ST._at||Date.now()))) : t.remainingMs;
  const s=Math.ceil(left/1000), clock=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const label = t.locked ? "⏰ Time's up — answers are locked"
              : t.held ? `✓ Everyone has answered · ${clock} left`
              : t.paused ? `⏸ Paused · ${clock}` : `⏱ ${clock}`;
  el.className = "timer" + ((t.locked || (t.running && s<=15)) ? " low" : "");
  el.innerHTML = `<span class="tlabel">${label}</span><span class="tbar"><i style="width:${Math.max(0,Math.min(100,left/t.totalMs*100))}%"></i></span>`;
}
setInterval(paintTimer, 250);

function render(){
  if(!joined){ screenJoin(); return; }
  if(!ST){ app.innerHTML="<div class='card'>Connecting…</div>"; return; }
  const p=ST.phase;
  if(p==="lobby"){
    app.innerHTML = `${scoreHeader()}<div class="card center stack"><span class="kicker good">You're in!</span><h2>Waiting for the host to start…</h2><p class="muted">${ST.playerCount} player${ST.playerCount===1?"":"s"} in the room.</p></div>`;
    return;
  }
  if(p==="round"){
    const locked = ME.answer!=null;
    app.innerHTML = `${scoreHeader()}
      <div class="card stack">
        <span class="kicker ${ST.points===20?'gold':''}">Round ${ST.round+1} of ${ST.total}${ST.points===20?" · double points":""}</span>
        <h2>${esc(ST.move)}</h2>
        ${timerHTML()}
        ${locked? `<div class="feedback"><b>Your pick: ${esc(ME.answer)}</b><br>Changed your mind? Tap a different one until time runs out or the host reveals.</div>` : `<p class="muted">Tap the rule that governs this organization.</p>`}
        ${defenseButtons(timeUp(), null)}
      </div>`;
    if(!timeUp()) wireDefense();
    return;
  }
  if(p==="reveal"){
    const ok = ST.works.includes(ME.answer);
    app.innerHTML = `${scoreHeader()}
      <div class="card stack">
        <span class="kicker">Round ${ST.round+1} result</span>
        <div class="feedback ${ok?'good':'bad'}"><b>${ME.answer? (ok?`✓ ${ME.answer} is right! +${ST.points}`:`✗ ${ME.answer} isn't the right rule`) : "No answer this round"}</b><br>${esc(ST.why)}</div>
        ${defenseButtons(true, ST.works)}
      </div>`;
    return;
  }
  if(p==="bonus"){
    const locked = ME.answer!=null;
    app.innerHTML = `${scoreHeader()}
      <div class="card stack"><span class="kicker gold">Bonus · +${ST.points}</span>
        <h2>${esc(ST.prompt)}</h2>
        ${timerHTML()}
        ${locked?`<div class="feedback"><b>Your pick: ${esc(ME.answer)}</b><br>Tap a different one to change it until time runs out or the host scores the bonus.</div>`:`<p class="muted">Pick the one you'd build on.</p>`}
        ${defenseButtons(timeUp(), null)}</div>`;
    if(!timeUp()) wireDefense();
    return;
  }
  if(p==="bonusReveal"){
    app.innerHTML = `${scoreHeader()}<div class="card stack"><span class="kicker gold">Bonus scored</span>
      <div class="feedback good">${ME.answer?`+${ST.points} for making a choice.`:"No answer — no bonus."} ${esc(ST.note||"")}</div></div>`;
    return;
  }
  if(p==="results"){
    const me = ST.scoreboard.findIndex(t=>t.name===ME.name);
    app.innerHTML = `${scoreHeader()}
      <div class="card center stack"><span class="kicker gold">Final</span><div class="big">${ME.score}</div>
        <p class="muted">${me>=0?`You placed #${me+1} of ${ST.scoreboard.length}`:""}</p></div>
      <div class="card stack"><span class="kicker">${esc(ST.revealTitle)}</span><p>${esc(ST.reveal)}</p>
        <ul class="stack" style="margin:0;padding-left:20px">${ST.lessons.map(([h,b])=>`<li><b>${esc(h)}</b> ${esc(b)}</li>`).join("")}</ul></div>`;
    return;
  }
  app.innerHTML="<div class='card'>…</div>";
}

if(SEAT){ app.innerHTML="<div class='card'>Rejoining your game…</div>"; } else { screenJoin(); }
</script>
</body>
</html>
