<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Ready — Host</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span> Risk Ready — Host</div>
  <div id="app" class="stack"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";
const socket = io();
const app = document.getElementById("app");
let PIN = null, ST = null, QRDATA = null;
// if this screen sleeps or reloads, reconnect to the same game (the server holds it for 10 minutes)
const HKEY = "risk-ready:host";
const savedHost = () => { try { return JSON.parse(sessionStorage.getItem(HKEY) || "null"); } catch (e) { return null; } };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const joinURL = () => location.origin + "/play.html";

socket.on("connect", () => { socket.emit("host:create", { origin: location.origin, resume: savedHost() }); });
socket.on("host:created", d => { PIN = d.pin; QRDATA = d.qr || null; try { sessionStorage.setItem(HKEY, JSON.stringify({ pin: d.pin, hostKey: d.hostKey })); } catch (e) {} render(); });
socket.on("state", s => { ST = s; ST._at = Date.now(); render(); paintTimer(); });
socket.on("host:gone", () => { app.innerHTML = "<div class='card'>Host session ended.</div>"; });

function defenseGrid(){
  return `<div class="grid-def">` + ST.defenses.map(d=>`
    <div class="def"><span class="tag">${d.id}</span><span><span class="name">${esc(d.name)}</span><br><span class="desc">${esc(d.desc)}</span></span></div>`).join("") + `</div>`;
}
/* ties: places are shared (1, 1, 3); these turn a rank and a list of names into words */
function ord(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function names(list){ if(list.length>3) return `${list.length} other teams`; return list.length<2 ? (list[0]||"") : list.slice(0,-1).join(", ")+" & "+list[list.length-1]; }

/* breach meter, streaks, and the vote split */
function fmtMeter(m, v){ return (m.unit==="$" ? "$"+Number(v).toLocaleString() : Number(v).toLocaleString()+(m.unit?" "+m.unit:"")); }
function metersBlock(all){
  // during play show only this act's meters; the results screen shows all of them
  const list=(ST.meters||[]).filter(m=>all || !m.act || m.act===ST.act);
  if(!list.length) return "";
  return `<div class="meters">` + list.map(m=>`<div class="meter ${m.value>0?"hit":""}"><span class="ml">${esc(m.label)}</span><span class="mv">${esc(fmtMeter(m,m.value))}</span></div>`).join("") + `</div>`;
}
function impactBlock(){
  const i=ST.impact; if(!i) return "";
  const m=(ST.meters||[]).find(x=>x.id===i.meter)||{unit:""};
  return i.through
    ? `<div class="feedback bad impact"><b>💥 The attacker got through: +${esc(fmtMeter(m,i.amount))}</b><br>Only ${i.correct} of ${i.total} teams chose a working defense.${i.text?" "+esc(i.text):""}</div>`
    : `<div class="feedback good impact"><b>🛡 The class blocked it.</b><br>${i.correct} of ${i.total} teams chose a working defense.${i.text?" "+esc(i.text):""}</div>`;
}

function board(){
  if(!ST.scoreboard.length) return "";
  return `<table class="lb"><tbody>` + ST.scoreboard.map((t,i)=>`<tr class="${t.rank===1&&t.score>0?'win':''}"><td>${t.tied?"T-":""}${t.rank}</td><td>${esc(t.name)}${t.streak>=3?` <span title="${t.streak} in a row">🔥${t.streak}</span>`:""}</td><td class="s">${t.score}</td></tr>`).join("") + `</tbody></table>`;
}
function countsBlock(){
  if(!ST.counts) return "";
  const max = Math.max(1,...Object.values(ST.counts));
  return Object.keys(ST.counts).map(k=>{
    const n=ST.counts[k], correct = ST.works && ST.works.includes(k);
    return `<div class="count"><span class="lbl"><b>${k}</b> ${esc(((ST.defenses||[]).find(d=>d.id===k)||{}).name||"")}</span><span class="cn">${n}</span><span class="bar" style="flex:1"><i style="width:${Math.round(n/max*100)}%;background:${correct?'var(--good)':'var(--accent)'}"></i></span></div>`;
  }).join("");
}

/* round countdown — the server owns the clock; this only paints it between updates */
function timerHTML(){ return ST && ST.timer ? `<div class="timer big" id="timer"></div>` : ""; }
function timeUp(){ return !!(ST && ST.timer && ST.timer.locked); }
function paintTimer(){
  const el=document.getElementById("timer"); if(!el||!ST||!ST.timer) return;
  const t=ST.timer, left=t.running ? Math.max(0, t.remainingMs-(Date.now()-(ST._at||Date.now()))) : t.remainingMs;
  const s=Math.ceil(left/1000), clock=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const label = t.locked ? "⏰ Time's up — answers are locked"
              : t.held ? `✓ Everyone has answered · ${clock} left`
              : t.paused ? `⏸ Paused · ${clock}` : `⏱ ${clock}`;
  el.className = "timer big" + ((t.locked || (t.running && s<=15)) ? " low" : "");
  el.innerHTML = `<span class="tlabel">${label}</span><span class="tbar"><i style="width:${Math.max(0,Math.min(100,left/t.totalMs*100))}%"></i></span>`;
}
setInterval(paintTimer, 250);
function timerControls(){
  if(!ST || !ST.timer) return "";
  return `<button class="btn" id="tpause" ${ST.timer.locked?"disabled":""}>${ST.timer.paused?"▶ Resume":"⏸ Pause"}</button> <button class="btn" id="tmore">+30s</button>`;
}
function wireTimer(){
  const a=document.getElementById("tpause"); if(a) a.onclick=()=>socket.emit("host:pause");
  const b=document.getElementById("tmore"); if(b) b.onclick=()=>socket.emit("host:extend");
}

function render(){
  if(!ST){ app.innerHTML="<div class='card'>Connecting…</div>"; return; }
  const p = ST.phase;
  if(p==="lobby"){
    app.innerHTML = `
      <div class="card center stack">
        <span class="kicker navy">Scan to join</span>
        ${QRDATA?`<img src="${QRDATA}" alt="QR code to join the game" width="240" height="240" style="align-self:center;width:240px;height:240px;border-radius:14px;background:#fff;padding:10px">`:""}
        <p class="muted" style="margin:.1em 0 0">or go to <b>${esc(joinURL())}</b> and enter the PIN:</p>
        <span class="kicker">Game PIN</span>
        <div class="pin">${PIN||"…"}</div>
        <p class="muted">${ST.playerCount} player${ST.playerCount===1?"":"s"} joined</p>
        <div class="players">${ST.players.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div>
        <div class="row" style="justify-content:center"><button class="btn primary lg" id="start" ${ST.playerCount<1?"disabled":""}>Start the game</button></div>
        ${ST.playerCount<1?'<p class="note">Waiting for at least one player…</p>':''}
      </div>
      <div class="card stack"><span class="kicker navy">Read aloud</span><p>${esc(ST.story)}</p>
        <span class="kicker">The four approaches (Act 3)</span>${defenseGrid()}<p class="note">Act 1 (Name it) and Act 2 (Which lever?) show their own choices on screen each round.</p></div>`;
    const b=document.getElementById("start"); if(b) b.onclick=()=>socket.emit("host:start");
    return;
  }
  if(p==="round" || p==="reveal"){
    const revealed = p==="reveal";
    app.innerHTML = `
      <div class="card stack">
        <div class="row spread"><span class="kicker ${ST.points===20?'gold':''}">${ST.act?esc(ST.act)+" · ":""}Round ${ST.round+1} of ${ST.total}${ST.points===20?" · double points":" · "+ST.points+" pts"}</span>
          <span class="muted">${ST.answered} of ${ST.playerCount} answered</span></div>
        ${revealed?"":timerHTML()}
        <h2>${esc(ST.move)}</h2>
        ${ST.customChoices && !revealed ? defenseGrid() : ""}
        ${revealed ? `${impactBlock()}<div class="feedback good"><b>Answer: ${ST.works.join(" or ")}</b><br>${esc(ST.why)}</div>${countsBlock()}${ST.discuss?`<div class="feedback"><b>💬 Discuss</b> — ${esc(ST.discuss)}</div>`:""}${ST.lesson?`<p class="note">📘 ${esc(ST.lesson)}</p>`:""}`
                   : ST.votesShown ? `<div class="feedback"><b>📊 Votes are in — answers are locked.</b> How did the class split?</div>${countsBlock()}`
                   : `<p class="muted">${esc((ST.ui&&ST.ui.choosing)||"Students are choosing on their devices…")}</p><div class="bar"><i style="width:${ST.playerCount?Math.round(ST.answered/ST.playerCount*100):0}%"></i></div>`}
        <div class="hr"></div>
        <div class="row spread">
          ${revealed ? `<span></span><button class="btn primary lg" id="next">${ST.round+1<ST.total?"Next round":"Bonus round"}</button>`
                     : `<span class="row">${ST.votesShown?"":timerControls()}</span><span class="row">${ST.votesShown?"":`<button class="btn lg" id="votes">📊 Show the votes</button>`}<button class="btn primary lg" id="reveal">Reveal answer</button></span>`}
        </div>
      </div>
      ${metersBlock()}
      <div class="card stack"><span class="kicker navy">Scoreboard</span>${board()}</div>`;
    const rv=document.getElementById("reveal"); if(rv) rv.onclick=()=>socket.emit("host:reveal");
    const vt=document.getElementById("votes"); if(vt) vt.onclick=()=>socket.emit("host:votes");
    const nx=document.getElementById("next"); if(nx) nx.onclick=()=>socket.emit("host:next");
    wireTimer();
    return;
  }
  if(p==="bonus" || p==="bonusReveal"){
    const revealed = p==="bonusReveal";
    app.innerHTML = `
      <div class="card stack">
        <span class="kicker gold">Bonus · +${ST.points}</span>
        <h2>${esc(ST.prompt)}</h2>
        ${revealed?"":timerHTML()}
        ${revealed ? `<div class="feedback good"><b>Everyone who answered earns +${ST.points}.</b> ${esc(ST.note||"")}</div>`
                   : `<p class="muted">${ST.answered} of ${ST.playerCount} answered</p><div class="bar"><i style="width:${ST.playerCount?Math.round(ST.answered/ST.playerCount*100):0}%"></i></div>`}
        <div class="hr"></div>
        <div class="row spread"><span class="row">${revealed?"":timerControls()}</span>
          ${revealed ? `<button class="btn primary lg" id="next">See the winner</button>` : `<button class="btn primary lg" id="reveal">Score the bonus</button>`}</div>
      </div>
      <div class="card stack"><span class="kicker navy">Scoreboard</span>${board()}</div>`;
    const rv=document.getElementById("reveal"); if(rv) rv.onclick=()=>socket.emit("host:reveal");
    const nx=document.getElementById("next"); if(nx) nx.onclick=()=>socket.emit("host:next");
    wireTimer();
    return;
  }
  if(p==="results"){
    const sb = ST.scoreboard, top = sb.length ? sb[0].score : 0;
    const champs = top > 0 ? sb.filter(t => t.rank === 1) : [];
    const medals = {1:"🥇", 2:"🥈", 3:"🥉"};
    // one podium step per place; tied teams share the step (after a tie for 1st there is no 2nd)
    const podium = top > 0 ? [1,2,3].map(r => {
      const g = sb.filter(t => t.rank === r && t.score > 0); if(!g.length) return "";
      return `<div class="medal"><span class="m">${medals[r]}</span><span class="mn">${g.map(t=>esc(t.name)).join("<br>")}</span><span class="ms">${g.length>1?"T-":""}${ord(r)} · ${g[0].score}</span></div>`;
    }).join("") : "";
    const banner = !champs.length
      ? `<h1>No points this round</h1><p class="muted">Nobody scored — try another round?</p>`
      : champs.length === 1
        ? `<h1>🏆 ${esc(champs[0].name)}</h1><div><span class="pill gold">${esc(ST.champion)}</span></div>`
        : `<h1>🏆 It's a tie!</h1><h2 style="margin:0">${esc(names(champs.map(c=>c.name)))}</h2><div><span class="pill gold">Co-champions · ${esc(ST.champion)}</span></div>`;
    app.innerHTML = `
      <div class="card center stack"><span class="kicker gold">${champs.length>1?"Champions — tied":"Champions"}</span>
        ${banner}
        ${podium?`<div class="podium">${podium}</div>`:""}</div>
      ${ST.meters&&ST.meters.length?`<div class="card stack"><span class="kicker">Final damage</span>${metersBlock(true)}</div>`:""}
      <div class="card stack"><span class="kicker navy">Final scoreboard</span>${board()}</div>
      <div class="card stack"><span class="kicker">${esc(ST.revealTitle)}</span><p>${esc(ST.reveal)}</p>
        <div><b>${esc(ST.lessonsTitle)}:</b></div>
        <ul class="stack" style="margin:0;padding-left:20px">${ST.lessons.map(([h,b])=>`<li><b>${esc(h)}</b> ${esc(b)}</li>`).join("")}</ul></div>
      ${ST.debrief&&ST.debrief.length?`<div class="card stack"><span class="kicker navy">💬 Talk it through</span>
        <ul class="stack" style="margin:0;padding-left:20px">${ST.debrief.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>${ST.debriefKey?`<p class="note">📘 Answer key (host only): ${esc(ST.debriefKey)}</p>`:""}</div>`:""}
      <div class="row"><button class="btn primary" id="again">Play again (same teams)</button> <button class="btn" id="endgame">End game for everyone</button></div>`;
    const a=document.getElementById("again"); if(a) a.onclick=()=>socket.emit("host:restart");
    const eg=document.getElementById("endgame"); if(eg) eg.onclick=()=>{ if(confirm("End the game on every device?")){ socket.emit("host:end"); try{ sessionStorage.removeItem(HKEY); }catch(e){} app.innerHTML="<div class='card stack'><h2>Game ended</h2><p class='muted'>Every device now shows the end screen.</p><a class='btn primary' href='host.html'>Start a new game</a></div>"; } };
    return;
  }
  app.innerHTML="<div class='card'>…</div>";
}
</script>
</body>
</html>
